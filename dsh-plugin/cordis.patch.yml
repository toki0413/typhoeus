# 提比翁（typhoeus）的只读 MCP 连接。
#
# 本包是配置型 bundle：不导出 apply(ctx)，只插入一行 @deepseek-ai/dsh-mcp-client，
# 由它拉起 `typhoeus-mcp`（pip/pipx 安装的 Python 服务）。
#
# 前置：pipx install typhoeus  ·  TYPHOEUS_HOME 指向放 data/ 与 out/ 的目录
- insert:
    - id: mcp-typhoeus
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: typhoeus
        transport: stdio
        command: typhoeus-mcp
        args: []
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        failOnStartupError: true
        toolCallTimeoutMs: 120000
