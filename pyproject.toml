[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typhoeus"
version = "0.6.1"
description = "城市内涝情景推演与验收内核（只读 MCP 服务 + 本地值班台）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.0", "scipy>=1.11", "rasterio>=1.3"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
typhoeus = "typhoeus.cli:main"
typhoeus-mcp = "typhoeus.mcp_server:main"
typhoeus-web = "typhoeus.webapp:main"

[tool.setuptools]
packages = ["typhoeus"]

[tool.setuptools.package-data]
typhoeus = ["*.py"]
