<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c0f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0c0f'/%3E%3Cpath d='M32 9c8 10 14 17 14 26a14 14 0 1 1-28 0c0-6 4-10 7-15 2 5 5 7 7 9 2-7 0-13 0-20z' fill='%23e5b567'/%3E%3C/svg%3E"
    />
    <title>黄金时间 · MVS</title>
    <style>
      :root {
        --bg: #0a0c0f;
        --panel: rgba(13, 17, 22, 0.84);
        --line: rgba(255, 255, 255, 0.1);
        --ink: #f2efe9;
        --muted: #9aa3ad;
        --accent: #e5b567;
        --accent-strong: #f0c67e;
        --danger: #e06a4a;
        --ok: #6fbf9a;
        --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --mono: ui-monospace, "SFMono-Regular", "Noto Sans Mono CJK SC", monospace;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); }
      body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      #app { display: block; width: 100vw; height: 100vh; }
      #vignette {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 3;
        transition: opacity 0.5s ease;
        background: radial-gradient(ellipse at center, transparent 42%, rgba(78, 12, 0, 0.72) 100%);
      }

      .panel {
        position: fixed; z-index: 4; color: var(--ink);
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
        padding: 14px 16px; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px) saturate(1.1);
        font: 13px/1.65 var(--sans);
      }
      .panel-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin-bottom: 10px;
      }
      .panel-title {
        font: 600 12px/1 var(--mono); letter-spacing: 0.16em; color: var(--accent);
        text-transform: uppercase;
      }
      .status-pill {
        padding: 3px 8px; border-radius: 999px; font-size: 11px;
        color: var(--accent); background: rgba(229, 181, 103, 0.1);
        border: 1px solid rgba(229, 181, 103, 0.3);
      }
      .status-pill:empty { display: none; }

      #hud { top: 16px; left: 16px; width: 244px; }
      .hud-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .hud-scenario { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
      .hud-time { font: 600 13px/1 var(--mono); color: var(--accent); }
      .hud-seed {
        margin: 4px 0 12px; color: #6f7882;
        font: 10px/1.4 var(--mono); letter-spacing: 0.08em;
      }
      .stat { display: grid; grid-template-columns: 30px 1fr 42px; align-items: center; gap: 8px; margin: 7px 0; }
      .stat-label { color: var(--muted); font-size: 12px; }
      .stat-value { text-align: right; font: 600 11px/1 var(--mono); color: #c8cdd4; }
      .bar { display: block; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .bar i {
        display: block; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #8fb0c9, #c3d2df);
        transition: width 0.25s ease;
      }
      .bar i.hot { background: linear-gradient(90deg, #d98145, var(--danger)); }
      .hud-foot {
        display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px;
        border-top: 1px solid var(--line); color: var(--muted); font-size: 11px;
      }
      .hud-hint { margin-top: 8px; color: var(--accent); font-size: 11px; }

      #door-ui { left: 50%; bottom: 26px; transform: translateX(-50%); width: min(360px, calc(100vw - 32px)); display: none; }
      #door-ui button { width: 100%; }
      #door-ui .row { display: flex; gap: 8px; margin-top: 8px; }
      #door-ui .row button { width: auto; flex: 1; }

      #move {
        left: 16px; bottom: 26px; display: none;
        padding: 12px 18px; text-align: center; z-index: 5;
      }
      #move .move-hint { color: var(--muted); font-size: 12px; letter-spacing: 0.03em; }
      #move .move-hint b { color: var(--accent); font-weight: 700; }
      #move [data-dist] { margin-left: 6px; color: var(--accent); font: 600 11px/1 var(--mono); }
      #move .move-pad {
        display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 40px);
        gap: 6px; justify-content: center; margin-top: 9px;
      }
      #move .move-pad .up { grid-column: 2; grid-row: 1; }
      #move .move-pad .left { grid-column: 1; grid-row: 2; }
      #move .move-pad .right { grid-column: 3; grid-row: 2; }
      #move .move-pad .down { grid-column: 2; grid-row: 2; }
      #move .move-act { width: 100%; margin-top: 9px; }

      #actions { right: 16px; bottom: 16px; display: none; }
      #incidents { right: 16px; top: 112px; width: 280px; display: none; }
      .incident-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
      .incident-title { font-size: 14px; font-weight: 700; }
      .incident-timer { color: var(--danger); font: 600 11px/1 var(--mono); }
      .incident-detail { margin: 6px 0 10px; color: #b9c0c8; font-size: 12px; line-height: 1.7; }
      .incident-options { display: grid; gap: 6px; }
      #incidents button { width: 100%; text-align: left; }

      #radio { left: 16px; top: 184px; width: 320px; }
      .radio-head {
        display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
        color: var(--muted); font: 600 10px/1 var(--mono); letter-spacing: 0.18em;
      }
      .radio-dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
        box-shadow: 0 0 8px rgba(111, 191, 154, 0.8);
      }
      .radio-line { margin: 6px 0; font-size: 12px; line-height: 1.6; }
      .radio-line.dim { opacity: 0.55; }
      .radio-speaker {
        display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 4px;
        background: rgba(229, 181, 103, 0.12); color: var(--accent); font-size: 10px;
      }

      #pause-btn { top: 16px; right: 16px; display: none; z-index: 6; min-height: 36px; padding: 8px 14px; font-size: 12px; }
      body[data-run="playing"] #pause-btn { display: block; }

      #debrief {
        inset: 0; display: none; overflow: auto; padding: 40px; z-index: 25;
        background: rgba(7, 9, 12, 0.97); border: 0; border-radius: 0; box-shadow: none;
      }
      #debrief > * { max-width: 980px; margin-left: auto; margin-right: auto; }
      #debrief { font-size: 14px; }
      #debrief h2 { margin-top: 0; font-size: clamp(26px, 3vw, 34px); letter-spacing: 0.04em; }
      .debrief-actions {
        display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px;
      }
      #debrief h3 { margin: 28px auto 10px; color: var(--accent); font-size: 13px; letter-spacing: 0.12em; }
      #debrief .history { color: #b8b2a7; font-size: 13px; }
      #debrief ul { padding-left: 18px; }
      .evidence { list-style: none; padding: 0 !important; display: grid; gap: 10px; }
      .evidence li {
        padding: 12px 14px; border-left: 2px solid rgba(229, 181, 103, 0.55);
        background: rgba(255, 255, 255, 0.035); border-radius: 0 8px 8px 0;
      }
      .evidence b { display: block; color: var(--accent); letter-spacing: 0.06em; }
      .evidence span { display: block; margin-top: 4px; color: var(--ink); }
      .evidence em { display: block; margin-top: 2px; color: var(--muted); font-style: normal; }

      #shell {
        position: fixed; inset: 0; z-index: 30; display: none; overflow: auto;
        padding: clamp(28px, 7vh, 72px) clamp(22px, 7vw, 96px);
        background:
          radial-gradient(120% 90% at 50% 0%, rgba(62, 46, 28, 0.55), rgba(7, 8, 10, 0.99) 68%),
          #08090b;
      }
      #shell.open { display: block; }
      .screen { max-width: 760px; }
      .kicker {
        display: flex; align-items: center; gap: 12px;
        font: 600 11px/1 var(--mono); letter-spacing: 0.3em; color: var(--accent);
      }
      .kicker::before { content: ""; width: 34px; height: 1px; background: var(--accent); opacity: 0.6; }
      #shell h1 {
        margin: 18px 0 8px; font-size: clamp(42px, 8vw, 82px);
        letter-spacing: 0.06em; font-weight: 700; line-height: 1.08;
      }
      .sub { margin: 0 0 28px; color: #b8b2a7; font-size: clamp(15px, 2vw, 19px); }
      .brief p { margin: 0 0 10px; max-width: 34em; color: #d9d4ca; font-size: 16px; line-height: 1.9; }
      .flow {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        margin: 28px 0 8px; max-width: 640px;
      }
      .flow div {
        padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
        background: rgba(255, 255, 255, 0.025);
      }
      .flow b { display: block; color: var(--accent); font: 600 11px/1 var(--mono); letter-spacing: 0.14em; }
      .title-art {
        position: fixed; right: 4vw; top: 50%; width: min(34vw, 420px);
        transform: translateY(-50%); pointer-events: none;
      }
      .title-art svg { width: 100%; height: auto; filter: drop-shadow(0 0 42px rgba(229, 181, 103, 0.12)); }
      @media (max-width: 1100px) { .title-art { display: none; } }
      .flow span { display: block; margin-top: 6px; color: #d3cec5; font-size: 13px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 32px 0 16px; }
      .hint { color: #7f7a72; font-size: 12px; letter-spacing: 0.08em; }
      .notice {
        max-width: 40em; margin: 18px 0 0; padding: 12px 14px;
        border: 1px solid #8a3b2a; background: rgba(120, 30, 10, 0.18);
        color: #ffb59e; font-size: 13px; line-height: 1.7; border-radius: 8px;
      }
      .stats {
        margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line);
        color: var(--muted); font-size: 12px; line-height: 1.8;
      }
      .settings {
        position: sticky; bottom: 0; margin-top: 44px; padding: 18px 0 8px;
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        border-top: 1px solid var(--line);
        background: linear-gradient(to top, rgba(8, 9, 11, 0.96) 60%, rgba(8, 9, 11, 0));
      }
      .settings-title { margin-right: 6px; color: #7f7a72; font: 600 11px/1 var(--mono); letter-spacing: 0.2em; }

      button {
        font: 600 13px/1 var(--sans); padding: 10px 16px; min-height: 42px;
        color: var(--ink); background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 8px;
        cursor: pointer; letter-spacing: 0.02em;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
      }
      button:hover { background: rgba(255, 255, 255, 0.11); }
      button:active { transform: translateY(1px); }
      button.primary {
        background: linear-gradient(180deg, var(--accent-strong), #cf9c4e);
        border-color: transparent; color: #1a1408;
        box-shadow: 0 8px 22px rgba(229, 181, 103, 0.22);
      }
      button.primary:hover { background: linear-gradient(180deg, #f7d18d, #d7a251); }
      button.danger { border-color: rgba(224, 106, 74, 0.45); color: #f0a08c; }
      button.danger:hover { background: rgba(224, 106, 74, 0.14); }
      button:disabled { opacity: 0.42; cursor: default; transform: none; }
      button:focus-visible { outline: 2px solid #ffd479; outline-offset: 2px; }
      button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      .settings button { min-height: 36px; padding: 6px 10px; font-size: 12px; }
      .volume {
        display: flex; align-items: center; gap: 8px; margin-left: auto;
        color: var(--muted); font-size: 11px; letter-spacing: 0.08em;
      }
      .volume input[type="range"] { width: 110px; accent-color: var(--accent); cursor: pointer; }
      .volume-value { min-width: 36px; color: var(--accent); font-family: var(--mono); }
      input[type="range"]:focus-visible { outline: 2px solid #ffd479; outline-offset: 3px; }

      body:not([data-run="playing"]) #hud,
      body:not([data-run="playing"]) #door-ui,
      body:not([data-run="playing"]) #actions,
      body:not([data-run="playing"]) #incidents,
      body:not([data-run="playing"]) #radio,
      body:not([data-run="playing"]) #vignette { display: none !important; }

      html.large-text .panel { font-size: 15px; line-height: 1.75; }
      html.large-text .brief p, html.large-text .sub, html.large-text button { font-size: 17px; }
      html.large-text .stats, html.large-text .hint { font-size: 14px; }
      html.large-text #incidents { width: 320px; }
      html.large-text #hud { width: 280px; }

      html.high-contrast .panel { background: #000; border-color: #fff; color: #fff; }
      html.high-contrast #shell { background: #000; }
      html.high-contrast .kicker { color: #ffd479; }
      html.high-contrast .sub, html.high-contrast .stats, html.high-contrast .hint,
      html.high-contrast .brief p, html.high-contrast .flow span,
      html.high-contrast .stat-label, html.high-contrast .hud-foot,
      html.high-contrast .hud-seed { color: #fff; }
      html.high-contrast .flow div { border-color: #fff; background: #000; }
      html.high-contrast .bar { background: #333; }
      html.high-contrast button { background: #000; border-color: #fff; color: #fff; }
      html.high-contrast button.primary { background: #ffd479; border-color: #ffd479; color: #000; }
      html.high-contrast .radio-line.dim { opacity: 1; }
      html.high-contrast .evidence li { border-color: #ffd479; background: #000; }
      html.high-contrast .evidence em { color: #fff; }

      html.reduce-motion *,
      html.reduce-motion *::before,
      html.reduce-motion *::after {
        animation: none !important; transition: none !important; scroll-behavior: auto !important;
      }

      @media (max-width: 720px) {
        .flow { grid-template-columns: 1fr; }
        #incidents { top: 84px; left: 16px; right: 16px; width: auto; }
        #radio { top: auto; bottom: 132px; left: 16px; right: 16px; width: auto; }
        #actions { left: 16px; right: 16px; bottom: 16px; }
        #door-ui { bottom: 70px; }
        #debrief { padding: 22px; }
        .settings { position: static; }
        .volume { margin-left: 0; }
      }
      #hud, #actions, #incidents { transition: opacity 0.35s ease; }
      body[data-hero="on"] #hud,
      body[data-hero="on"] #actions,
      body[data-hero="on"] #incidents { opacity: 0.18; }
      body[data-hero="on"] #radio { opacity: 0.92; }
      #move { transition: opacity 0.3s ease; }
      body[data-hero="on"] #move { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body data-run="title">
    <canvas id="app" aria-label="居民楼火灾现场示意图"></canvas>
    <div id="vignette"></div>
    <div id="hud" class="panel"></div>
    <div id="move" class="panel"></div>
    <div id="door-ui" class="panel"></div>
    <div id="actions" class="panel"></div>
    <div id="incidents" class="panel"></div>
    <div id="radio" class="panel" aria-live="polite"></div>
    <button id="pause-btn" class="panel" aria-label="暂停训练">暂停</button>
    <div id="debrief" class="panel" role="dialog" aria-modal="true" aria-label="行动后回顾"></div>
    <div id="shell"></div>
    <noscript>
      <p style="padding: 24px; color: #f2efe9; font-family: sans-serif">
        需要启用 JavaScript 才能运行这套训练。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
