<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c0f" />
    <title>Phase 1 · 建筑进入 · 黄金时刻</title>
    <style>
      :root {
        --bg: #0a0c0f;
        --panel: rgba(13, 17, 22, 0.86);
        --line: rgba(255, 255, 255, 0.1);
        --ink: #f2efe9;
        --muted: #9aa3ad;
        --accent: #e5b567;
        --danger: #e06a4a;
        --ok: #6fbf9a;
        --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --mono: ui-monospace, "SFMono-Regular", "Noto Sans Mono CJK SC", monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
      }
      #building-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .panel {
        position: fixed;
        z-index: 4;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px) saturate(1.1);
        font: 13px/1.6 var(--sans);
      }
      #meters {
        top: 14px;
        left: 14px;
        width: 232px;
      }
      #meters h1 {
        margin: 0 0 8px;
        font-size: 14px;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .row {
        display: grid;
        grid-template-columns: 58px 1fr;
        align-items: baseline;
        gap: 8px;
        margin: 4px 0;
        font: 12px/1.5 var(--mono);
        color: var(--muted);
      }
      .row b {
        font-weight: 500;
        color: var(--ink);
        word-break: break-all;
      }
      .row b.accent {
        color: var(--accent);
      }
      #layout-select {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        font: inherit;
        padding: 1px 4px;
        cursor: pointer;
      }
      #layout-select option {
        background: #0d1116;
        color: var(--ink);
      }
      #layout-select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #routes-panel {
        top: 14px;
        right: 14px;
        width: 274px;
        max-height: calc(100vh - 28px);
        overflow-y: auto;
      }
      #routes-panel h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      #routes button {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--ink);
        font: 12px/1.45 var(--sans);
        padding: 8px 10px;
        margin: 0 0 6px;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      #routes button:hover {
        background: rgba(229, 181, 103, 0.16);
        border-color: rgba(229, 181, 103, 0.5);
      }
      #routes button b {
        font-weight: 600;
      }
      #routes button small {
        display: block;
        color: var(--muted);
        font: 11px/1.3 var(--mono);
        margin-top: 2px;
      }
      #routes .hint {
        margin: 0;
        color: var(--muted);
        font: 12px/1.55 var(--sans);
      }
      #routes-panel h2:not(:first-child) {
        margin-top: 12px;
      }
      #residents .resident-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin: 0 0 6px;
        font: 12px/1.4 var(--sans);
      }
      #residents .resident-name {
        color: var(--ink);
      }
      #residents .resident-meta {
        color: var(--muted);
        font: 11px/1.3 var(--mono);
      }
      #residents .resident-actions {
        display: flex;
        gap: 4px;
      }
      #residents button,
      #tools button {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--ink);
        font: 11px/1 var(--sans);
        padding: 4px 8px;
        border-radius: 7px;
        cursor: pointer;
      }
      #residents button:hover:not(:disabled),
      #tools button:hover:not(:disabled) {
        background: rgba(229, 181, 103, 0.16);
        border-color: rgba(229, 181, 103, 0.5);
      }
      #residents button:disabled,
      #tools button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #tools button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 0 0 6px;
      }
      #tools button small {
        color: var(--muted);
        font: 11px/1.3 var(--mono);
        margin-left: 4px;
      }
      #residents .hint {
        margin: 0;
        color: var(--muted);
        font: 12px/1.55 var(--sans);
      }
      .actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .actions button {
        flex: 1;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--ink);
        font: 12px/1 var(--sans);
        padding: 10px 8px;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .actions button:hover {
        background: rgba(229, 181, 103, 0.16);
        border-color: rgba(229, 181, 103, 0.5);
      }
      #log {
        left: 14px;
        bottom: 16px;
        width: 340px;
        max-height: 190px;
        overflow: hidden;
        font: 12px/1.55 var(--sans);
      }
      #log p {
        margin: 0 0 4px;
        color: var(--muted);
      }
      #log p.ok {
        color: var(--ok);
      }
      #log p.danger {
        color: var(--danger);
      }
      #hint {
        right: 14px;
        bottom: 16px;
        width: 300px;
        color: var(--muted);
        font: 12px/1.5 var(--sans);
      }
      #hint kbd {
        font: 11px/1 var(--mono);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 5px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.05);
      }
      .scene-link {
        margin-top: 6px;
        font-size: 12px;
      }
      .scene-link a {
        color: var(--accent);
        text-decoration: none;
      }
      .scene-link a:hover {
        text-decoration: underline;
      }
      .scene-link a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* 触控/键盘通用的移动 D-pad：桌面也显示，但按钮更小。 */
      #move-pad {
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(3, 38px);
        grid-template-rows: repeat(2, 38px);
        gap: 6px;
        padding: 8px;
      }
      #move-pad button {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        border-radius: 9px;
        font: 14px/1 var(--sans);
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #move-pad button[data-move="up"] {
        grid-column: 2;
        grid-row: 1;
      }
      #move-pad button[data-move="left"] {
        grid-column: 1;
        grid-row: 2;
      }
      #move-pad button[data-move="down"] {
        grid-column: 2;
        grid-row: 2;
      }
      #move-pad button[data-move="right"] {
        grid-column: 3;
        grid-row: 2;
      }
      #move-pad button:active {
        background: rgba(229, 181, 103, 0.22);
        border-color: rgba(229, 181, 103, 0.55);
      }
      #move-pad button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #outcome {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: none;
        place-items: center;
        background: rgba(5, 7, 9, 0.72);
        backdrop-filter: blur(6px);
      }
      #outcome.show {
        display: grid;
      }
      #outcome .card {
        width: min(460px, 88vw);
        max-height: 88vh;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px 24px;
        text-align: center;
      }
      #outcome h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      #outcome p {
        color: var(--muted);
        font: 13px/1.65 var(--sans);
        margin: 0 0 16px;
      }
      #outcome button {
        border: 1px solid var(--accent);
        background: rgba(229, 181, 103, 0.16);
        color: var(--accent);
        font: 13px/1 var(--sans);
        padding: 11px 20px;
        border-radius: 10px;
        cursor: pointer;
      }
      #outcome .debrief {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        text-align: left;
        max-height: 168px;
        overflow-y: auto;
        font: 12px/1.55 var(--sans);
      }
      #outcome .debrief li {
        margin: 0 0 8px;
        color: var(--accent);
        word-break: break-word;
      }
      #outcome .debrief li b {
        color: var(--ink);
        font: 11px/1 var(--mono);
        margin-right: 4px;
      }
      #outcome .debrief li span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font: 11px/1.5 var(--sans);
      }
      #outcome-score {
        text-align: left;
        font: 12px/1.7 var(--mono);
        color: var(--muted);
        margin: 0 0 14px;
      }
      #outcome-score .stars {
        color: var(--accent);
        letter-spacing: 0.2em;
      }
      #outcome-curve svg {
        width: 100%;
        height: auto;
        display: block;
        margin: 4px 0 10px;
      }
      #outcome-curve path {
        fill: none;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }
      #outcome-curve path.smoke {
        stroke: #9aa3ad;
      }
      #outcome-curve path.heat {
        stroke: #e06a4a;
      }
      #outcome-curve path.fire {
        stroke: #e5b567;
      }
      #outcome-curve path.ghost-smoke,
      #outcome-curve path.ghost-heat {
        stroke-width: 1.5;
        stroke-dasharray: 4 3;
        opacity: 0.7;
      }
      #outcome-curve path.ghost-smoke {
        stroke: #9aa3ad;
      }
      #outcome-curve path.ghost-heat {
        stroke: #e06a4a;
      }
      #outcome-curve .curve-legend {
        color: var(--muted);
        font: 11px/1.4 var(--mono);
      }
      @media (pointer: coarse) {
        .panel button,
        #routes button,
        #residents button,
        #tools button,
        #outcome button {
          min-height: 44px;
        }
        #move-pad {
          grid-template-columns: repeat(3, 48px);
          grid-template-rows: repeat(2, 48px);
          gap: 8px;
        }
        #move-pad button {
          width: 48px;
          height: 48px;
          font-size: 18px;
        }
      }
      @media (max-width: 900px) {
        #log,
        #hint {
          display: none;
        }
        #routes-panel {
          width: 210px;
        }
      }
      /* 窄屏把仪表与路线上下堆叠，避免两块浮层互相遮挡。 */
      @media (max-width: 640px) {
        #meters {
          width: calc(100vw - 28px);
          max-height: 38vh;
          overflow-y: auto;
        }
        #routes-panel {
          top: auto;
          bottom: 14px;
          width: calc(100vw - 28px);
          max-height: 46vh;
        }
        /* 窄屏把移动面板抬到路线面板上方，避免互相遮挡。 */
        #move-pad {
          bottom: calc(46vh + 24px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="building-canvas"></canvas>

    <section class="panel" id="meters">
      <h1>建筑进入 · 火场</h1>
      <div class="row"><span>户型</span><b><select id="layout-select" aria-label="选择户型"></select></b></div>
      <div class="row"><span>种子</span><b id="hud-seed">--</b></div>
      <div class="row"><span>所在</span><b id="hud-room" class="accent">--</b></div>
      <div class="row"><span>目标</span><b id="hud-target">--</b></div>
      <div class="row"><span>体力</span><b id="hud-stamina">--</b></div>
      <div class="row"><span>烟气</span><b id="hud-exposure">--</b></div>
      <div class="row"><span>空呼</span><b id="hud-air">--</b></div>
      <div class="row"><span>风</span><b id="hud-wind">--</b></div>
      <div class="row"><span>居民</span><b id="hud-resident">--</b></div>
      <div class="scene-link"><a href="./">教学关</a> · <a href="./room.html">单房间原型</a> · <a href="./drills.html">演练</a> · <a id="daily-link" href="?daily=1">每日挑战</a></div>
    </section>

    <section class="panel" id="routes-panel">
      <h2>可选路线</h2>
      <div id="routes"></div>
      <h2>居民</h2>
      <div id="residents"></div>
      <h2>工具</h2>
      <div id="tools"></div>
      <div class="actions">
        <button id="save-btn">保存</button>
        <button id="continue-btn" hidden>继续上一局</button>
        <button id="reset-btn">重开</button>
      </div>
    </section>

    <section class="panel" id="log" aria-live="polite"></section>

    <section class="panel" id="move-pad" aria-label="移动方向键">
      <button data-move="up" aria-label="向上移动">▲</button>
      <button data-move="left" aria-label="向左移动">◀</button>
      <button data-move="down" aria-label="向下移动">▼</button>
      <button data-move="right" aria-label="向右移动">▶</button>
    </section>

    <section class="panel" id="hint">
      <div><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 选择路线 · <kbd>R</kbd> 重算 · 点击居民牵出/背出</div>
      <div><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> / 方向键移动 · 触屏用方向键</div>
      <div>风向会改变烟路。</div>
    </section>

    <section id="outcome" role="dialog" aria-modal="true" aria-labelledby="outcome-title">
      <div class="card">
        <h2 id="outcome-title"></h2>
        <p id="outcome-body"></p>
        <div id="outcome-score"></div>
        <div id="outcome-curve"></div>
        <ul id="outcome-debrief" class="debrief"></ul>
        <button id="outcome-reset">再来一次</button>
      </div>
    </section>

    <script type="module" src="/src/buildingMain.ts"></script>
  </body>
</html>
