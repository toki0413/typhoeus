name: MVS CI

on:
  push:
    paths:
      - 'golden-hour/mvs/**'
      - '.github/workflows/mvs-ci.yml'
  pull_request:
    paths:
      - 'golden-hour/mvs/**'
      - '.github/workflows/mvs-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golden-hour/mvs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: golden-hour/mvs/package-lock.json
      - run: npm ci
      - run: npm run check
